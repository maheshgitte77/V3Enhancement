apiVersion: apps/v1
kind: Deployment
metadata:
  name: resume-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: resume-service
  template:
    metadata:
      labels:
        app: resume-service
    spec:
      containers:
        - name: resume-service
          image: maheshgitte482/resume-service:latest
          imagePullPolicy: Always # Forces Kubernetes to pull the latest image
          ports:
            - containerPort: 5001
          env:
            - name: PORT
              value: "5001"
            - name: KAFKA_BROKER
              value: "kafka.default.svc.cluster.local:9092"

          resources:
            limits:
              memory: "512Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /health
              port: 5001
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 5001
            initialDelaySeconds: 5
            periodSeconds: 10

---
apiVersion: v1
kind: Service
metadata:
  name: resume-service
spec:
  selector:
    app: resume-service
  ports:
    - protocol: TCP
      port: 80
      targetPort: 5001
  type: ClusterIP
