version: "3.8"

services:
  zookeeper:
    image: wurstmeister/zookeeper
    container_name: zookeeper
    ports:
      - "2181:2181"
    networks:
      - kafka-network

  kafka1:
    image: wurstmeister/kafka
    container_name: kafka1
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka1:9092
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_DEFAULT_REPLICATION_FACTOR: 3
      KAFKA_NUM_PARTITIONS: 6
      KAFKA_CREATE_TOPICS: "response_analyze:6:3"
    depends_on:
      - zookeeper
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics.sh --bootstrap-server localhost:9092 --list"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - kafka-network

  kafka2:
    image: wurstmeister/kafka
    container_name: kafka2
    ports:
      - "9093:9093"
    environment:
      KAFKA_BROKER_ID: 2
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka2:9093
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_DEFAULT_REPLICATION_FACTOR: 3
      KAFKA_NUM_PARTITIONS: 6
      KAFKA_CREATE_TOPICS: "response_analyze:6:3"
    depends_on:
      - zookeeper
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics.sh --bootstrap-server localhost:9093 --list"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - kafka-network

  kafka3:
    image: wurstmeister/kafka
    container_name: kafka3
    ports:
      - "9094:9094"
    environment:
      KAFKA_BROKER_ID: 3
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka3:9094
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_DEFAULT_REPLICATION_FACTOR: 3
      KAFKA_NUM_PARTITIONS: 6
      KAFKA_CREATE_TOPICS: "response_analyze:6:3"
    depends_on:
      - zookeeper
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics.sh --bootstrap-server localhost:9094 --list"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - kafka-network

  resume-service:
    build: ../microservices/resume-service
    container_name: resume-service
    ports:
      - "5010:5010"
    environment:
      PORT: 5010
      KAFKA_BROKER: ${KAFKA_BROKER}
      KAFKA_TOPIC: resume-screening
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      REDIS_HOST: ${REDIS_HOST}
      REDIS_PORT: ${REDIS_PORT}
      NOTIFICATION_SER_URL: ${NOTIFICATION_SERVICE_URL}
      GROUP_ID_RESUME_SCREENING: "resume-screening-group"
      NUM_CONSUMERS: ${NUM_CONSUMERS}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      DB_HOST: ${DB_HOST}
      S3_BUCKET_NAME: ${S3_BUCKET_NAME}
      DB_PORT: ${DB_PORT}
      S3_REGION: ${S3_REGION}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY}
    depends_on:
      - kafka1
      - kafka2
      - kafka3
    networks:
      - kafka-network

  response-analysis-service:
    build: ../microservices/response-analysis-service
    container_name: response-analysis-service
    ports:
      - "7010:7010"
    environment:
      PORT: 7010
      KAFKA_BROKER: ${KAFKA_BROKER}
      KAFKA_TOPIC: "response_analyze"
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      GROUP_ID_RESUME_SCREENING: "response_analyze_group"
      BUCKET_NAME: "techevalhelloassistance"
      KAFKA_VIDEO_TOPIC: "response_analyze"
      GROUP_ID_VIDEO_ANALYZE: "response_analyze_group"
      NUM_CONSUMERS: ${NUM_CONSUMERS}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      NOTIFICATION_SERVICE_URL: ${NOTIFICATION_SERVICE_URL}
    depends_on:
      kafka1:
        condition: service_healthy
      kafka2:
        condition: service_healthy
      kafka3:
        condition: service_healthy
    networks:
      - kafka-network

  ai-service:
    build: ../microservices/ai
    container_name: ai-service
    ports:
      - "6001:6001"
    environment:
      PORT: 6001
      KAFKA_BROKER: ${KAFKA_BROKER}
      KAFKA_TOPIC: screening-questions
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      GROUP_ID_RESUME_SCREENING: "screening-questions-group"
      NUM_CONSUMERS: ${NUM_CONSUMERS}
      OPEN_AI_KEY: ${OPEN_AI_KEY}
    depends_on:
      - kafka1
      - kafka2
      - kafka3
    networks:
      - kafka-network

networks:
  kafka-network:
    name: docker_kafka-network
    driver: bridge
