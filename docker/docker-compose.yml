services:
  zookeeper:
    image: wurstmeister/zookeeper
    container_name: zookeeper
    ports:
      - "2181:2181"
    environment:
      ZOOKEEPER_AUTOPURGE_PURGE_INTERVAL: 24
      ZOOKEEPER_AUTOPURGE_SNAP_RETAIN_COUNT: 3
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"
    networks:
      - kafka-network

  kafka1:
    image: wurstmeister/kafka
    container_name: kafka1
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      # 1. Define Protocols
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      # 2. Listen on both ports
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9092
      # 3. Advertise: 'kafka1' for docker, 'localhost' for host
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka1:29092,EXTERNAL://localhost:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_DEFAULT_REPLICATION_FACTOR: 3
      KAFKA_MIN_INSYNC_REPLICAS: 2
      KAFKA_NUM_PARTITIONS: 12
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
      KAFKA_UNCLEAN_LEADER_ELECTION_ENABLE: "false"
      KAFKA_CREATE_TOPICS: "response_analyze:12:3,screening.analysis.requests:12:3,screening.analysis.results:12:3,screening.analysis.failures:6:3,screening.summary.requests:6:3,screening.summary.results:6:3,resume-screening:12:3"

    depends_on:
      - zookeeper
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "kafka-topics.sh --bootstrap-server localhost:9092 --list",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - kafka-network

  kafka2:
    image: wurstmeister/kafka
    container_name: kafka2
    ports:
      - "9093:9093"
    environment:
      KAFKA_BROKER_ID: 2
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29093,EXTERNAL://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka2:29093,EXTERNAL://localhost:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_DEFAULT_REPLICATION_FACTOR: 3
      KAFKA_MIN_INSYNC_REPLICAS: 2
      KAFKA_NUM_PARTITIONS: 12
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
      KAFKA_UNCLEAN_LEADER_ELECTION_ENABLE: "false"
    depends_on:
      - zookeeper
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "kafka-topics.sh --bootstrap-server localhost:9093 --list",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - kafka-network

  kafka3:
    image: wurstmeister/kafka
    container_name: kafka3
    ports:
      - "9094:9094"
    environment:
      KAFKA_BROKER_ID: 3
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29094,EXTERNAL://0.0.0.0:9094
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka3:29094,EXTERNAL://localhost:9094
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_DEFAULT_REPLICATION_FACTOR: 3
      KAFKA_MIN_INSYNC_REPLICAS: 2
      KAFKA_NUM_PARTITIONS: 12
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
      KAFKA_UNCLEAN_LEADER_ELECTION_ENABLE: "false"
    depends_on:
      - zookeeper
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "kafka-topics.sh --bootstrap-server localhost:9094 --list",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - kafka-network

  resume-service:
    build: ../microservices/resume-service
    container_name: resume-service
    ports:
      - "5010:5010"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      PORT: 5010
      # Using INTERNAL ports
      KAFKA_BROKER: kafka1:29092,kafka2:29093,kafka3:29094
      KAFKA_TOPIC: resume-screening
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      REDIS_HOST: ${REDIS_HOST}
      REDIS_PORT: ${REDIS_PORT}
      NOTIFICATION_SER_URL: ${NOTIFICATION_SERVICE_URL}
      GROUP_ID_RESUME_SCREENING: "resume-screening-group"
      NUM_CONSUMERS: ${NUM_CONSUMERS}
      MONGODB_URI: ${MONGODB_URI}
      S3_BUCKET_NAME: ${S3_BUCKET_NAME}
      S3_REGION: ${S3_REGION}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY}
      CREDIT_SERVICE_URL: ${CREDIT_SERVICE_URL}
      CREDIT_SERVICE_KEY: ${CREDIT_SERVICE_KEY}
      COMMUNICATION_SERVICE_KEY: ${COMMUNICATION_SERVICE_KEY}
    depends_on:
      kafka1:
        condition: service_healthy
      kafka2:
        condition: service_healthy
      kafka3:
        condition: service_healthy
    networks:
      - kafka-network

  response-analysis-service:
    build: ../microservices/response-analysis-service
    container_name: response-analysis-service
    ports:
      - "7010:7010"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      PORT: 7010
      USE_KAFKA: "true"
      # Using INTERNAL ports
      KAFKA_BROKER: kafka1:29092,kafka2:29093,kafka3:29094
      KAFKA_BROKERS: kafka1:29092,kafka2:29093,kafka3:29094
      KAFKA_TOPIC: "screening.analysis.requests"
      KAFKA_VIDEO_TOPIC: "response_analyze"
      KAFKA_CONSUMER_GROUP: "response-analysis-consumers"
      WORKER_COUNT: 4
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      GROUP_ID_VIDEO_ANALYZE: "response_analyze_group"
      BUCKET_NAME: "techevalhelloassistance"
      NUM_CONSUMERS: ${NUM_CONSUMERS}
      MONGODB_URI: ${MONGODB_URI}
      NOTIFICATION_SERVICE_URL: ${NOTIFICATION_SERVICE_URL}
      COMMUNICATION_SERVICE_URL: ${COMMUNICATION_SERVICE_URL}
      CREDIT_SERVICE_URL: ${CREDIT_SERVICE_URL}
      CREDIT_SERVICE_KEY: ${CREDIT_SERVICE_KEY}
      ASSEMBLY_AI_API_KEY: ${ASSEMBLY_AI_API_KEY}
      ASSEMBLY_AI_MODEL: ${ASSEMBLY_AI_MODEL}
      DEEPGRAM_API_KEY: ${DEEPGRAM_API_KEY}
      DEEPGRAM_MODEL: ${DEEPGRAM_MODEL}
      SCREENING_SERVICE_URL: "http://host.docker.internal:8080"
      ENABLE_PROCTOR_MODEL_SIGNALS: ${ENABLE_PROCTOR_MODEL_SIGNALS:-true}
      PROCTOR_MODEL_API_URL: ${PROCTOR_MODEL_API_URL:-http://host.docker.internal:8081}
      PROCTOR_MODEL_API_TIMEOUT_MS: ${PROCTOR_MODEL_API_TIMEOUT_MS:-180000}
      PROCTOR_MODEL_ASYNC_ENABLED: ${PROCTOR_MODEL_ASYNC_ENABLED:-true}
      PROCTOR_MODEL_ASYNC_POLL_INTERVAL_MS: ${PROCTOR_MODEL_ASYNC_POLL_INTERVAL_MS:-10000}
      PROCTOR_MODEL_ASYNC_TIMEOUT_MS: ${PROCTOR_MODEL_ASYNC_TIMEOUT_MS:-180000}
    depends_on:
      kafka1:
        condition: service_healthy
      kafka2:
        condition: service_healthy
      kafka3:
        condition: service_healthy
    networks:
      - kafka-network
    restart: unless-stopped
    healthcheck:
      test:
        ["CMD", "curl", "-f", "http://localhost:7010/api/response/v2.5/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  ai-service:
    build: ../microservices/ai
    container_name: ai-service
    ports:
      - "6001:6001"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      PORT: 6001
      # Using INTERNAL ports
      KAFKA_BROKER: kafka1:29092,kafka2:29093,kafka3:29094
      KAFKA_TOPIC: screening-questions
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      GROUP_ID_RESUME_SCREENING: "screening-questions-group"
      NUM_CONSUMERS: ${NUM_CONSUMERS}
      OPEN_AI_KEY: ${OPEN_AI_KEY}
      CREDIT_SERVICE_URL: ${CREDIT_SERVICE_URL}
      CREDIT_SERVICE_KEY: ${CREDIT_SERVICE_KEY}
      # Redis for categoryTracker (same as resume-service)
      REDIS_HOST: ${REDIS_HOST}
      REDIS_PORT: ${REDIS_PORT}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      HIRECORRECTO_MAIN_SERVICE_URL: ${HIRECORRECTO_MAIN_SERVICE_URL}
      ENABLE_PROGRAMMING_VERIFICATION: ${ENABLE_PROGRAMMING_VERIFICATION}
    depends_on:
      kafka1:
        condition: service_healthy
      kafka2:
        condition: service_healthy
      kafka3:
        condition: service_healthy
    networks:
      - kafka-network

networks:
  kafka-network:
    name: docker_kafka-network
    driver: bridge
