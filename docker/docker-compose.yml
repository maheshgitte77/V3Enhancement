version: "3.8"

services:
  zookeeper:
    image: wurstmeister/zookeeper
    container_name: zookeeper
    ports:
      - "2181:2181"
    environment:
      ZOOKEEPER_AUTOPURGE_PURGE_INTERVAL: 24
      ZOOKEEPER_AUTOPURGE_SNAP_RETAIN_COUNT: 3
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"
    networks:
      - kafka-network

  kafka1:
    image: wurstmeister/kafka
    container_name: kafka1
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka1:9092
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_DEFAULT_REPLICATION_FACTOR: 3
      KAFKA_NUM_PARTITIONS: 6
      KAFKA_CREATE_TOPICS: "response_analyze:6:3,screening.analysis.requests:6:3,screening.analysis.results:6:3,screening.analysis.failures:3:3,screening.summary.requests:3:3,screening.summary.results:3:3"
      # Log retention settings to prevent disk overflow
      KAFKA_LOG_RETENTION_HOURS: 168
      KAFKA_LOG_RETENTION_BYTES: 1073741824
      KAFKA_LOG_SEGMENT_BYTES: 536870912
      KAFKA_LOG_CLEANUP_POLICY: delete
      KAFKA_LOG_CLEANER_ENABLE: "true"
    depends_on:
      - zookeeper
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "kafka-topics.sh --bootstrap-server localhost:9092 --list",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"
    networks:
      - kafka-network

  kafka2:
    image: wurstmeister/kafka
    container_name: kafka2
    ports:
      - "9093:9093"
    environment:
      KAFKA_BROKER_ID: 2
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka2:9093
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_DEFAULT_REPLICATION_FACTOR: 3
      KAFKA_NUM_PARTITIONS: 6
      KAFKA_CREATE_TOPICS: "response_analyze:6:3,screening.analysis.requests:6:3,screening.analysis.results:6:3,screening.analysis.failures:3:3,screening.summary.requests:3:3,screening.summary.results:3:3"
      # Log retention settings to prevent disk overflow
      KAFKA_LOG_RETENTION_HOURS: 168
      KAFKA_LOG_RETENTION_BYTES: 1073741824
      KAFKA_LOG_SEGMENT_BYTES: 536870912
      KAFKA_LOG_CLEANUP_POLICY: delete
      KAFKA_LOG_CLEANER_ENABLE: "true"
    depends_on:
      - zookeeper
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "kafka-topics.sh --bootstrap-server localhost:9093 --list",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"
    networks:
      - kafka-network

  kafka3:
    image: wurstmeister/kafka
    container_name: kafka3
    ports:
      - "9094:9094"
    environment:
      KAFKA_BROKER_ID: 3
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka3:9094
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_DEFAULT_REPLICATION_FACTOR: 3
      KAFKA_NUM_PARTITIONS: 6
      KAFKA_CREATE_TOPICS: "response_analyze:6:3,screening.analysis.requests:6:3,screening.analysis.results:6:3,screening.analysis.failures:3:3,screening.summary.requests:3:3,screening.summary.results:3:3"
      # Log retention settings to prevent disk overflow
      KAFKA_LOG_RETENTION_HOURS: 168
      KAFKA_LOG_RETENTION_BYTES: 1073741824
      KAFKA_LOG_SEGMENT_BYTES: 536870912
      KAFKA_LOG_CLEANUP_POLICY: delete
      KAFKA_LOG_CLEANER_ENABLE: "true"
    depends_on:
      - zookeeper
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "kafka-topics.sh --bootstrap-server localhost:9094 --list",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"
    networks:
      - kafka-network

  resume-service:
    build: ../microservices/resume-service
    container_name: resume-service
    ports:
      - "5010:5010"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      PORT: 5010
      KAFKA_BROKER: ${KAFKA_BROKER}
      KAFKA_TOPIC: resume-screening
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      REDIS_HOST: ${REDIS_HOST}
      REDIS_PORT: ${REDIS_PORT}
      NOTIFICATION_SER_URL: ${NOTIFICATION_SERVICE_URL}
      GROUP_ID_RESUME_SCREENING: "resume-screening-group"
      NUM_CONSUMERS: ${NUM_CONSUMERS}
      MONGODB_URI: ${MONGODB_URI}
      S3_BUCKET_NAME: ${S3_BUCKET_NAME}
      S3_REGION: ${S3_REGION}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY}
      CREDIT_SERVICE_URL: ${CREDIT_SERVICE_URL}
    depends_on:
      - kafka1
      - kafka2
      - kafka3
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"
    networks:
      - kafka-network

  response-analysis-service:
    build: ../microservices/response-analysis-service
    container_name: response-analysis-service
    ports:
      - "7010:7010"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      PORT: 7010
      # Kafka Integration
      USE_KAFKA: "true"
      KAFKA_BROKER: ${KAFKA_BROKER}
      KAFKA_BROKERS: ${KAFKA_BROKER}
      KAFKA_TOPIC: "screening.analysis.requests"
      KAFKA_VIDEO_TOPIC: "response_analyze"
      KAFKA_CONSUMER_GROUP: "response-analysis-consumers"
      # Scaling
      WORKER_COUNT: 4
      # AI
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      # Legacy (keep for compatibility)
      GROUP_ID_VIDEO_ANALYZE: "response_analyze_group"
      BUCKET_NAME: "techevalhelloassistance"
      NUM_CONSUMERS: ${NUM_CONSUMERS}
      # Database
      MONGODB_URI: ${MONGODB_URI}
      NOTIFICATION_SERVICE_URL: ${NOTIFICATION_SERVICE_URL}
      CREDIT_SERVICE_URL: ${CREDIT_SERVICE_URL}
      # Code execution (for programming analysis)
      SCREENING_SERVICE_URL: "http://host.docker.internal:8080"
    depends_on:
      kafka1:
        condition: service_healthy
      kafka2:
        condition: service_healthy
      kafka3:
        condition: service_healthy
    networks:
      - kafka-network
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"
    healthcheck:
      test:
        ["CMD", "curl", "-f", "http://localhost:7010/api/response/v2.5/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  ai-service:
    build: ../microservices/ai
    container_name: ai-service
    ports:
      - "6001:6001"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      PORT: 6001
      KAFKA_BROKER: ${KAFKA_BROKER}
      KAFKA_TOPIC: screening-questions
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      GROUP_ID_RESUME_SCREENING: "screening-questions-group"
      NUM_CONSUMERS: ${NUM_CONSUMERS}
      OPEN_AI_KEY: ${OPEN_AI_KEY}
      CREDIT_SERVICE_URL: ${CREDIT_SERVICE_URL}
    depends_on:
      - kafka1
      - kafka2
      - kafka3
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"
    networks:
      - kafka-network

networks:
  kafka-network:
    name: docker_kafka-network
    driver: bridge
